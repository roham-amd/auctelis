# Org-level reusable Authority Diff workflow.
# Place this file in your org `.github` repository as:
#   .github/workflows/auctelis-org-reusable.yml
#
# Each application repo then calls it with two lines:
#
#   jobs:
#     auctelis:
#       uses: YOUR_ORG/.github/.github/workflows/auctelis-org-reusable.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#
# Optional inputs: locked (default false), path (default .).

name: auctelis (org reusable)

on:
  workflow_call:
    inputs:
      path:
        description: Repository path to assess
        type: string
        default: "."
      locked:
        description: If true, enforce AUTHORITY.lock + CODEOWNERS (strict ruleset on)
        type: boolean
        default: false
      comment-on-none:
        description: Post on every PR even when authority did not change
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHES / strict AppSec: replace the tag with an immutable pin, for example
      #   uses: roham-amd/auctelis@<40-hex> # v0.1.9
      # Write that form with `auctelis init --lockless --action-sha <40-hex>`
      # (offline) or `auctelis init --lockless --pin-sha` when github.com is reachable.
      # Do not fall back to api.github.com from a GHES host; pass --action-sha.
      - name: auctelis Authority Diff
        uses: roham-amd/auctelis@v0.1.9
        with:
          path: ${{ inputs.path }}
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: ${{ inputs.locked && 'true' || 'false' }}
          comment-on-none: ${{ inputs.comment-on-none && 'true' || 'false' }}
          output-dir: auctelis-out
