# Org-level reusable Authority Diff workflow.
# Place this file in your org `.github` repository as:
#   .github/workflows/auctelis-org-reusable.yml
#
# Each application repo then calls it with two lines:
#
#   jobs:
#     auctelis:
#       uses: YOUR_ORG/.github/.github/workflows/auctelis-org-reusable.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#
# Optional inputs: locked (default false), path (default .).

name: auctelis (org reusable)

on:
  workflow_call:
    inputs:
      path:
        description: Repository path to assess
        type: string
        default: "."
      locked:
        description: If true, enforce AUTHORITY.lock + CODEOWNERS (strict ruleset on)
        type: boolean
        default: false
      comment-on-none:
        description: Post on every PR even when authority did not change
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: auctelis Authority Diff
        uses: roham-amd/auctelis@v0.1.0
        with:
          path: ${{ inputs.path }}
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: ${{ inputs.locked && 'true' || 'false' }}
          comment-on-none: ${{ inputs.comment-on-none && 'true' || 'false' }}
          output-dir: auctelis-out
