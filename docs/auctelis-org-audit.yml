# Zero-laptop-install org Reach Audit (AUCT-047 / AUCT-049 / AUCT-055 / AUCT-057).
# Copy into your org `.github` repository (or any repo) as:
#   .github/workflows/auctelis-org-audit.yml
#
# Then Actions → auctelis org audit → Run workflow.
# Job Summary shows the Summary-first Reach Report + a dry-run rollout plan.
# Download the auctelis-org-report artifact for HTML/MD/JSON.
# A second run diffs against the previous successful run's artifact when present.
#
# Token: default GITHUB_TOKEN only sees the current repository.
# For private org repos, add a fine-grained PAT as secret AUCTELIS_AUDIT_TOKEN
# with Contents: read, Metadata: read, and Pull requests: read on the target org.
# Pull requests: read is required for `rollout --status` (GET /pulls).
# issues: write is not a default permission. Uncomment it below only when
# open_drift_issue is true, or when OPEN_DRIFT_ISSUE is "true" with schedule:.

name: auctelis org audit

on:
  workflow_dispatch:
    inputs:
      org:
        description: GitHub org (or user) slug to audit
        required: true
        type: string
      max_repos:
        description: Cap repositories scanned
        required: false
        type: string
        default: "50"
      include_forks:
        description: Include forks
        required: false
        type: boolean
        default: false
      org_reusable:
        description: Optional org slug for --org-reusable in report CTAs / dry-run rollout
        required: false
        type: string
        default: ""
      resolve_pins:
        description: Look up exact npm/PyPI versions (trust-on-first-use; default off)
        required: false
        type: boolean
        default: false
      open_drift_issue:
        description: Open or update one sticky drift Issue when reach changed (needs issues:write)
        required: false
        type: boolean
        default: false
  # Optional weekly scan — uncomment and set the cron.
  # schedule: leaves workflow_dispatch inputs empty; ORG falls back to
  # github.repository_owner and MAX_REPOS falls back to 50. resolve_pins stays off.
  # For scheduled Drift Issues, also set OPEN_DRIFT_ISSUE: "true" below and
  # uncomment issues: write.
  # schedule:
  #   - cron: "0 14 * * 1"

# Operators flip OPEN_DRIFT_ISSUE to "true" alongside schedule: + issues: write.
env:
  OPEN_DRIFT_ISSUE: "false"

permissions:
  contents: read
  actions: read
  # issues: write  # required only when open_drift_issue / OPEN_DRIFT_ISSUE is true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install auctelis (once)
        shell: bash
        run: |
          set -euo pipefail
          uv tool install --python 3.12 \
            "git+https://github.com/roham-amd/auctelis.git@v0.1.10#subdirectory=tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Notice when AUCTELIS_AUDIT_TOKEN is unset
        shell: bash
        env:
          AUCTELIS_AUDIT_TOKEN: ${{ secrets.AUCTELIS_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${AUCTELIS_AUDIT_TOKEN:-}" ]]; then
            echo "::notice::AUCTELIS_AUDIT_TOKEN is unset — falling back to github.token."
            echo "That token only reads the current repository. For a private org audit,"
            echo "add a fine-grained PAT (Contents: read, Metadata: read, Pull requests: read) as AUCTELIS_AUDIT_TOKEN."
          fi

      - name: Fetch prior audit baseline (optional)
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p auctelis-org-baseline
          echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          RUN_ID="$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch "${{ github.ref_name }}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty' || true)"
          if [[ -z "${RUN_ID}" ]]; then
            echo "no baseline — first successful run has nothing to diff"
            echo "no baseline" > auctelis-org-baseline/NOTE.txt
            exit 0
          fi
          if gh run download "${RUN_ID}" \
            --name auctelis-org-report \
            --dir auctelis-org-baseline; then
            if [[ -f auctelis-org-baseline/reach-report.json ]]; then
              echo "has_baseline=true" >> "$GITHUB_OUTPUT"
              echo "Loaded baseline from run ${RUN_ID}"
            else
              echo "no baseline — prior artifact lacked reach-report.json"
              echo "no baseline" > auctelis-org-baseline/NOTE.txt
            fi
          else
            echo "no baseline — could not download prior auctelis-org-report artifact"
            echo "no baseline" > auctelis-org-baseline/NOTE.txt
          fi

      - name: Org reach audit
        id: audit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.AUCTELIS_AUDIT_TOKEN || github.token }}
          ORG: ${{ inputs.org || github.repository_owner }}
          MAX_REPOS: ${{ inputs.max_repos || '50' }}
          INCLUDE_FORKS: ${{ inputs.include_forks }}
          ORG_REUSABLE: ${{ inputs.org_reusable }}
          RESOLVE_PINS: ${{ inputs.resolve_pins }}
          HAS_BASELINE: ${{ steps.baseline.outputs.has_baseline }}
        run: |
          set -euo pipefail
          mkdir -p auctelis-org-report
          EXTRA=()
          if [[ "${INCLUDE_FORKS}" == "true" ]]; then
            EXTRA+=(--include-forks)
          fi
          if [[ -n "${ORG_REUSABLE}" ]]; then
            EXTRA+=(--org-reusable "${ORG_REUSABLE}")
          fi
          if [[ "${RESOLVE_PINS}" == "true" ]]; then
            EXTRA+=(--resolve-pins)
          fi
          if [[ "${HAS_BASELINE}" == "true" ]]; then
            EXTRA+=(--baseline auctelis-org-baseline/reach-report.json)
          fi
          # AUCT-058: exit 1 means report-ready findings (unparsed/lock drift).
          # Tolerate it so Drift Issues + next-run --status success baselines work.
          set +e
          auctelis check --github "${ORG}" \
            --max-repos "${MAX_REPOS}" \
            --report auctelis-org-report/ \
            "${EXTRA[@]}"
          rc=$?
          set -e
          echo "audit_rc=${rc}" >> "$GITHUB_OUTPUT"
          if [[ "${rc}" -eq 1 ]]; then
            echo "::notice::Org audit exit 1 — reach report generated with unparsed configs or lock drift. Continuing so baselines and Drift Issues still run."
          fi
          if [[ "${rc}" -ge 2 ]]; then
            echo "::error::Org audit failed (exit ${rc})."
            exit "${rc}"
          fi
          if [[ ! -f auctelis-org-report/reach-report.json ]]; then
            echo "::error::reach-report.json missing after org audit (exit ${rc})."
            exit 2
          fi

      - name: Job Summary (Reach Report)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.AUCTELIS_AUDIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          {
            echo "# Auctelis org audit"
            echo ""
            if [[ -f auctelis-org-baseline/NOTE.txt ]] && \
               [[ ! -f auctelis-org-baseline/reach-report.json ]]; then
              echo "_no baseline_"
              echo ""
            fi
            if [[ -f auctelis-org-report/reach-report.md ]]; then
              cat auctelis-org-report/reach-report.md
            else
              echo "_No reach-report.md produced._"
            fi
            echo ""
            echo "## Rollout plan (dry-run)"
            echo ""
            echo '```text'
            if [[ -f auctelis-org-report/reach-report.json ]]; then
              auctelis rollout auctelis-org-report/reach-report.json --show-body --max-prs 3 || true
            else
              echo "No reach-report.json — skipped."
            fi
            echo '```'
            echo ""
            echo "## Rollout status"
            echo ""
            echo '```text'
            if [[ -f auctelis-org-report/reach-report.json ]]; then
              auctelis rollout auctelis-org-report/reach-report.json --status || true
            else
              echo "No reach-report.json — skipped."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update sticky drift issue
        if: inputs.open_drift_issue == true || (github.event_name == 'schedule' && env.OPEN_DRIFT_ISSUE == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Body is written by `check --report --baseline` as org-drift-issue.md
          # (render_fleet_drift_issue_md); absent when material tier-1+ drift is 0.
          if [[ ! -s auctelis-org-report/org-drift-issue.md ]]; then
            echo "::notice::No material org drift (no org-drift-issue.md) — left the sticky issue unchanged."
            exit 0
          fi
          if ! EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '[.[] | select(.pull_request == null) | select((.body // "") | contains("<!-- auctelis-org-drift -->")) | .number][0] // empty')"; then
            echo "::notice::Could not list issues. Grant issues: write on this workflow token and re-run with open_drift_issue / OPEN_DRIFT_ISSUE."
            exit 0
          fi
          jq -n --rawfile body auctelis-org-report/org-drift-issue.md --arg title "Auctelis org drift" \
            '{title:$title, body:$body}' > auctelis-org-drift-payload.json
          if [[ -n "${EXISTING}" ]]; then
            if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${EXISTING}" \
              --input auctelis-org-drift-payload.json >/dev/null; then
              echo "::notice::Could not update drift issue #${EXISTING}. Grant issues: write on this workflow token and re-run with open_drift_issue / OPEN_DRIFT_ISSUE."
              exit 0
            fi
            echo "Updated drift issue #${EXISTING}"
          else
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
              --input auctelis-org-drift-payload.json >/dev/null; then
              echo "::notice::Could not open a drift issue. Grant issues: write on this workflow token and re-run with open_drift_issue / OPEN_DRIFT_ISSUE."
              exit 0
            fi
            echo "Opened a drift issue"
          fi

      - name: Upload reach report artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auctelis-org-report
          path: auctelis-org-report/
          if-no-files-found: warn
