# Lockless-first quickstart. Upgrade: seal AUTHORITY.lock, set locked=true,
# run `auctelis ci init --owner @team`, protect with CODEOWNERS/rulesets.
# Prefer an immutable Action commit SHA in high-assurance repos.
name: auctelis
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install auctelis (git tag; PyPI not published yet)
        run: >
          pip install
          "git+https://github.com/roham-amd/auctelis.git@v0.3.4#subdirectory=tools"

      - name: auctelis Authority Diff
        # High-assurance pin (recommended):
        #   uses: roham-amd/auctelis/.github/actions/auctelis-gate@<commit-sha>
        uses: roham-amd/auctelis/.github/actions/auctelis-gate@v0.3.4
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: "false"
          strict-ruleset: "true"
          install-tools-from: path
          annotate: true
          output-dir: auctelis-out
