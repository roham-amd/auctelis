# Local auctelis container — kit baked into the image; mount a target repo at /work.
#
#   docker compose build
#   TARGET=/path/to/repo docker compose run --rm auctelis scan /work -o /tmp/auctelis-out
#   docker compose run --rm auctelis doctor --home /work
#
# Prefer writing artifacts outside the mounted target (e.g. /tmp/auctelis-out).

services:
  auctelis:
    build:
      context: .
      dockerfile: Dockerfile
    image: auctelis:local
    working_dir: /work
    volumes:
      - ${TARGET:-.}:/work
    # Drop privileges already handled by USER in the Dockerfile.
  # Compat alias
  auctelis:
    extends:
      service: auctelis
    image: auctelis:local
