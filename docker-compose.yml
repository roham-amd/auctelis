# Optional / deferred local container (not part of the Authority Diff install).
#
#   docker compose build
#   TARGET=/path/to/repo docker compose run --rm auctelis check /work
#   TARGET=/path/to/repo docker compose run --rm auctelis scan /work -o /tmp/auctelis-out
#
# Prefer writing artifacts outside the mounted target (e.g. /tmp/auctelis-out).

services:
  auctelis:
    build:
      context: .
      dockerfile: Dockerfile
    image: auctelis:local
    working_dir: /work
    volumes:
      - ${TARGET:-.}:/work
    # Drop privileges already handled by USER in the Dockerfile.
