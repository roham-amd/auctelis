name: auctelis Authority Diff
description: >-
  Tree-truth Authority Diff gate: extract base/head agent reach, report
  unreviewed growth honestly, and post a sticky PR comment when authority
  changes (opt into every-PR with comment-on-none). Does not execute target
  application code or contact MCP endpoints.
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Repository path to assess (relative to workspace)
    required: false
    default: "."
  mode:
    description: >-
      Only `scan` is supported. Any other value fails the Action loudly (legacy
      modes were removed; do not use mode to disable the gate).
    required: false
    default: "scan"
  trusted-policy:
    description: >-
      If true on pull_request events, fail the job when the PR modifies an
      existing .auctelis.yml unless base-ref CODEOWNERS covers that file. The
      gate diffs the policy hash from tree-truth; it does not execute policy
      rules from the head ref.
    required: false
    default: "true"
  output-dir:
    description: Output directory for auctelis artifacts
    required: false
    default: "auctelis-out"
  install-tools-from:
    description: >-
      Path to auctelis tools/ containing pyproject.toml. Empty (default) resolves to
      the Action-bundled tools directory when present, never the consumer
      workspace `tools/` by accident. Set to `path` or `pypi` to use a
      preinstalled `auctelis` on PATH (skip uv sync).
    required: false
    default: ""
  authority-diff:
    description: >-
      On pull_request events, scan the base ref and pass its baseline into the
      head scan so the PR comment is a true Authority Diff (facts added on head).
      Fetches the base ref at --depth=1 automatically when absent; fetch-depth: 0
      is not required.
    required: false
    default: "true"
  locked:
    description: >-
      If true, run AUTHORITY.lock drift check and fail on unapproved growth.
      Default false = lockless comment-only Authority Diff (no init / lock
      required). On a PR with locked=true and no base-ref lock, a head
      AUTHORITY.lock is treated as adoption bootstrap (BASELINE_ADOPTED);
      missing both base and head locks fails closed.
    required: false
    default: "false"
  lock-file:
    description: >-
      Path to AUTHORITY.lock relative to the scan target (default: AUTHORITY.lock)
    required: false
    default: ""
  strict-ruleset:
    description: >-
      When locked=true, defaults to true (UNVERIFIED ruleset fails growth) unless
      explicitly set to false. When locked=false (comment-only), defaults to false
      unless explicitly true. Leave empty to use that locked-aware default.
      MISSING rulesets still fail when locked=true.
    required: false
    default: ""
  comment-on-none:
    description: >-
      If true, post the Authority Diff on every PR even when authority did not
      change. Default false: the gate stays quiet on NONE (job summary still
      records PASS/NONE) and updates an existing sticky comment once to say so.
      Growth, reduction, unparsed configs, and drift always comment.
    required: false
    default: "false"
  auctelis-version:
    description: >-
      Exact PyPI / uv version to install when using the PyPI fast path
      (e.g. 0.1.11). Empty (default) derives from the Action ref tag when it
      looks like vX.Y.Z; otherwise falls back to Action-bundled tools/.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Reject unsupported mode
      if: inputs.mode != 'scan'
      shell: bash
      env:
        AUCTELIS_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        echo "::error::auctelis-gate mode='${AUCTELIS_MODE}' is not supported; only mode=scan is valid. Do not use mode to disable the gate."
        exit 1

    - name: Check watched agent paths on PR
      id: path_filter
      if: github.event_name == 'pull_request' && inputs.locked != 'true' && inputs.comment-on-none != 'true'
      shell: bash
      env:
        AUCTELIS_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        echo "skip=false" >> "$GITHUB_OUTPUT"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          exit 0
        fi
        base="origin/${AUCTELIS_BASE_REF}"
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          git fetch --no-tags --depth=1 origin "${AUCTELIS_BASE_REF}:refs/remotes/origin/${AUCTELIS_BASE_REF}" 2>/dev/null || true
        fi
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          exit 0
        fi
        changed="$(git diff --name-only "${base}..HEAD" 2>/dev/null || true)"
        if [[ -z "$changed" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "## auctelis Authority Diff" >> "$GITHUB_STEP_SUMMARY"
          echo "No changed files vs base ref — skipped setup." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if ! printf '%s\n' "$changed" | grep -iE '(^|/)(\.cursor|\.claude|\.codex|\.gemini|\.vscode|\.zed|\.config/zed|\.continue|\.kiro|\.roo|\.amazonq|\.opencode|\.windsurf|windsurf|\.github/workflows|\.github/actions|\.github/instructions|\.auctelis|\.clinerules)/|(^|/)(\.github/CODEOWNERS|\.github/copilot-instructions\.md|\.mcp\.json|\.claude\.json|opencode\.json|mcp[^/]*\.json|[^/]*mcp[^/]*\.toml|codex\.toml|SKILL\.md|AGENTS\.md|CLAUDE\.md|GEMINI\.md|\.gemini\.md|CODEX\.md|\.cursorrules|\.windsurfrules|windsurfrules|\.clinerules|copilot-instructions\.md|hooks\.(json|ya?ml)|hooks/[^/]+\.(json|md|py)|plugin\.(json|ya?ml)|\.cursor-plugin|[^/]*plugin[^/]*/package\.json|(sub)?agents\.json|(sub)?agents/[^/]+\.(md|json|ya?ml)|automations?\.json|automation\.ya?ml|automations/[^/]+\.(json|ya?ml|md)|agent[-_]card\.json|AUTHORITY\.lock|\.auctelis\.yml|CODEOWNERS)$' >/dev/null 2>&1; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "No agent-config or workflow paths changed — skipping uv sync."
          echo "## auctelis Authority Diff" >> "$GITHUB_STEP_SUMMARY"
          echo "No agent-config or workflow paths changed — skipped setup." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Resolve auctelis tools directory
      id: tools
      if: steps.path_filter.outputs.skip != 'true'
      shell: bash
      env:
        AUCTELIS_INSTALL_TOOLS_FROM: ${{ inputs.install-tools-from }}
        AUCTELIS_ACTION_PATH: ${{ github.action_path }}
        AUCTELIS_VERSION_INPUT: ${{ inputs.auctelis-version }}
        AUCTELIS_ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        # Prefer explicit input, then Action-bundled tools, and only then a
        # workspace-relative path. Never silently uv-sync a PR-controlled tools/.
        # Special values: path = preinstalled CLI; pypi = uv tool install from PyPI
        # (falls back to bundled tools/ when the package is unavailable).
        # AUCTELIS_PYPI_DEFAULT must match release-manifest.json pypi_live
        # (false until PyPI returns HTTP 200 for this version).
        AUCTELIS_PYPI_DEFAULT="false"
        chosen="${AUCTELIS_INSTALL_TOOLS_FROM}"
        ver="${AUCTELIS_VERSION_INPUT}"
        if [[ -z "${ver}" && "${AUCTELIS_ACTION_REF}" =~ ^v[0-9] ]]; then
          ver="${AUCTELIS_ACTION_REF#v}"
        fi
        echo "version=${ver}" >> "$GITHUB_OUTPUT"
        if [[ -f "${AUCTELIS_ACTION_PATH}/tools/pyproject.toml" ]]; then
          bundled="${AUCTELIS_ACTION_PATH}/tools"
        elif [[ -f "${AUCTELIS_ACTION_PATH}/../../../tools/pyproject.toml" ]]; then
          bundled="$(cd "$AUCTELIS_ACTION_PATH/../../.." && pwd)/tools"
        else
          bundled=""
        fi
        if [[ "${chosen}" == "path" ]]; then
          if ! command -v auctelis >/dev/null 2>&1; then
            echo "::error::install-tools-from=path but auctelis is not on PATH. pip/uv install auctelis first."
            exit 1
          fi
          echo "mode=path" >> "$GITHUB_OUTPUT"
          echo "dir=" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled auctelis on PATH."
          exit 0
        fi
        # Explicit install-tools-from: pypi always tries PyPI. Auto PyPI on tagged
        # refs only when AUCTELIS_PYPI_DEFAULT=true (pypi_live cutover).
        if [[ "${chosen}" == "pypi" || ( -z "${chosen}" && -n "${ver}" && "${AUCTELIS_PYPI_DEFAULT}" == "true" ) ]]; then
          echo "mode=pypi" >> "$GITHUB_OUTPUT"
          echo "dir=${bundled}" >> "$GITHUB_OUTPUT"
          echo "Will try PyPI install auctelis==${ver:-latest} (bundled fallback: ${bundled:-none})."
          exit 0
        fi
        if [[ -z "${chosen}" ]]; then
          if [[ -n "${bundled}" && -f "${bundled}/pyproject.toml" ]]; then
            chosen="${bundled}"
            echo "Using Action-bundled auctelis tools: ${chosen}"
          elif command -v auctelis >/dev/null 2>&1; then
            echo "mode=path" >> "$GITHUB_OUTPUT"
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "install-tools-from empty; using preinstalled auctelis on PATH."
            exit 0
          elif [[ -f tools/pyproject.toml ]]; then
            echo "::error::install-tools-from is empty and Action-bundled tools were not found. Refusing to default to workspace ./tools (PR-controlled code execution risk). Pass install-tools-from explicitly to a pinned auctelis checkout, or install auctelis and set install-tools-from: path."
            exit 1
          else
            echo "::error::Could not locate auctelis tools/pyproject.toml"
            exit 1
          fi
        fi
        if [[ ! -f "${chosen}/pyproject.toml" ]]; then
          echo "::error::install-tools-from=${chosen} has no pyproject.toml"
          exit 1
        fi
        # Soft warning when tools resolve inside the default workspace without an
        # explicit .auctelis-kit / action-bundled path.
        if [[ "${chosen}" == "tools" || "${chosen}" == "./tools" ]]; then
          echo "::warning::install-tools-from points at workspace tools/. Prefer a pinned auctelis kit checkout or Action-bundled tools so PRs cannot supply the scanner."
        fi
        echo "mode=uv" >> "$GITHUB_OUTPUT"
        echo "dir=${chosen}" >> "$GITHUB_OUTPUT"

    - name: Install uv
      if: steps.path_filter.outputs.skip != 'true' && steps.tools.outputs.mode != 'path'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.4
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install auctelis tooling
      if: steps.path_filter.outputs.skip != 'true' && steps.tools.outputs.mode != 'path'
      shell: bash
      env:
        AUCTELIS_INSTALL_MODE: ${{ steps.tools.outputs.mode }}
        AUCTELIS_TOOLS_DIR: ${{ steps.tools.outputs.dir }}
        AUCTELIS_VERSION: ${{ steps.tools.outputs.version }}
      run: |
        set -euo pipefail
        if [[ "${AUCTELIS_INSTALL_MODE}" == "pypi" ]]; then
          spec="auctelis"
          if [[ -n "${AUCTELIS_VERSION}" ]]; then
            spec="auctelis==${AUCTELIS_VERSION}"
          fi
          if uv tool install --python 3.12 "${spec}"; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "Installed ${spec} from PyPI."
            exit 0
          fi
          echo "::warning::PyPI install of ${spec} failed; falling back to Action-bundled tools/."
          if [[ -z "${AUCTELIS_TOOLS_DIR}" || ! -f "${AUCTELIS_TOOLS_DIR}/pyproject.toml" ]]; then
            echo "::error::PyPI install failed and Action-bundled tools/ were not found."
            exit 1
          fi
          cd "${AUCTELIS_TOOLS_DIR}"
          uv sync --locked --no-dev --no-editable
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          exit 0
        fi
        cd "${AUCTELIS_TOOLS_DIR}"
        uv sync --locked --no-dev --no-editable
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Flag .auctelis.yml policy edits on pull requests
      if: steps.path_filter.outputs.skip != 'true' && inputs.mode == 'scan' && inputs.trusted-policy == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        AUCTELIS_PATH: ${{ inputs.path }}
        AUCTELIS_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "Not a git work tree; skipping policy-edit check."
          exit 0
        fi
        base="origin/${AUCTELIS_BASE_REF}"
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          git fetch --no-tags --depth=1 origin "${AUCTELIS_BASE_REF}:refs/remotes/origin/${AUCTELIS_BASE_REF}" 2>/dev/null || true
        fi
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          echo "::error::Could not resolve base ref ${AUCTELIS_BASE_REF} for policy-edit check."
          exit 1
        fi
        if git diff --name-only "${base}..HEAD" | grep -E '(^|/)\.auctelis\.yml$' >/dev/null; then
          # First-adoption PRs that *add* .auctelis.yml (absent on base) must not fail the gate.
          if git cat-file -e "${base}:.auctelis.yml" 2>/dev/null; then
            # Policy edits are allowed only when trusted base-ref CODEOWNERS
            # covers .auctelis.yml. The gate still diffs the head policy hash
            # against the tree-truth base lock, so an approved edit is visible.
            owners_text=""
            for cand in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
              if owners_text="$(git show "${base}:${cand}" 2>/dev/null)"; then
                break
              fi
              owners_text=""
            done
            if [[ -n "$owners_text" ]] && printf '%s\n' "$owners_text" | grep -E '(^|[[:space:]])\.auctelis\.yml([[:space:]]|$)' >/dev/null 2>&1; then
              echo "::notice::PR edits .auctelis.yml under base CODEOWNERS; the diff will show the policy change for review."
            else
              echo "::error::PR modifies existing .auctelis.yml without base CODEOWNERS coverage. Add a .auctelis.yml owner, or keep policy edits on their own PR."
              exit 1
            fi
          else
            echo "PR adds .auctelis.yml for the first time (allowed for adoption)."
          fi
        fi
        echo "No blocking .auctelis.yml edits in this PR."

    - name: Run auctelis diff
      id: diff
      if: >-
        steps.path_filter.outputs.skip != 'true' &&
        inputs.mode == 'scan' &&
        inputs.authority-diff == 'true' &&
        github.event_name == 'pull_request'
      shell: bash
      env:
        AUCTELIS_PATH: ${{ inputs.path }}
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
        AUCTELIS_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        mkdir -p "$AUCTELIS_OUTPUT_DIR"
        echo "code=0" >> "$GITHUB_OUTPUT"
        base="origin/${AUCTELIS_BASE_REF}"
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          if ! git fetch --no-tags --depth=1 origin "${AUCTELIS_BASE_REF}:refs/remotes/origin/${AUCTELIS_BASE_REF}" 2>/dev/null; then
            echo "::error::Could not resolve base ref ${AUCTELIS_BASE_REF}."
            echo "code=2" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          base="origin/${AUCTELIS_BASE_REF}"
        fi
        set +e
        auctelis diff --base "$base" --repo "$AUCTELIS_PATH" --markdown --out "$AUCTELIS_OUTPUT_DIR/pr-comment.md"
        code=$?
        set -e
        echo "code=${code}" >> "$GITHUB_OUTPUT"
        if [[ -f "$AUCTELIS_OUTPUT_DIR/pr-comment.md" ]]; then
          echo "## auctelis Authority Diff" >> "$GITHUB_STEP_SUMMARY"
          cat "$AUCTELIS_OUTPUT_DIR/pr-comment.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Authority Diff PR comment
      if: always() && steps.path_filter.outputs.skip != 'true' && inputs.mode == 'scan' && github.event_name == 'pull_request'
      shell: bash
      env:
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        COMMENT="$AUCTELIS_OUTPUT_DIR/pr-comment.md"
        MARKER="<!-- auctelis-authority-diff -->"
        PR_NUM="${{ github.event.pull_request.number }}"
        if [[ ! -f "$COMMENT" ]]; then
          echo "No pr-comment.md; skipping sticky comment."
          exit 0
        fi
        if ! grep -qF "$MARKER" "$COMMENT"; then
          tmp="$(mktemp)"
          { echo "$MARKER"; cat "$COMMENT"; } >"$tmp"
          mv "$tmp" "$COMMENT"
        fi
        echo "## auctelis Authority Diff" >> "$GITHUB_STEP_SUMMARY"
        cat "$COMMENT" >> "$GITHUB_STEP_SUMMARY"
        if command -v gh >/dev/null 2>&1 && [[ -n "${GITHUB_TOKEN:-}" ]]; then
          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${PR_NUM}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" 2>/dev/null \
              | head -n 1 || true
          )"
          if [[ -n "${existing_id}" ]]; then
            if gh api "repos/${{ github.repository }}/issues/comments/${existing_id}" \
              -X PATCH -F body=@"$COMMENT" >/dev/null 2>&1; then
              echo "Updated sticky auctelis PR comment id=${existing_id}."
            else
              echo "::warning::Failed to update sticky auctelis PR comment."
            fi
          else
            gh pr comment "$PR_NUM" --body-file "$COMMENT" \
              || echo "::warning::Failed to post auctelis PR comment (check pull-requests: write)."
          fi
        else
          echo "gh unavailable; Authority Diff written to $COMMENT and job summary."
        fi

    - name: Upload auctelis artifacts
      if: always() && steps.path_filter.outputs.skip != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: auctelis-out
        path: ${{ inputs.output-dir }}
        if-no-files-found: warn

    - name: Fail job on diff verdict
      if: always() && steps.path_filter.outputs.skip != 'true' && inputs.mode == 'scan'
      shell: bash
      env:
        AUCTELIS_DIFF_CODE: ${{ steps.diff.outputs.code }}
        AUCTELIS_LOCKED: ${{ inputs.locked }}
      run: |
        set -euo pipefail
        code="${AUCTELIS_DIFF_CODE:-0}"
        [[ -z "$code" ]] && code=0
        if [[ "${AUCTELIS_LOCKED}" == 'true' && "$code" != '0' ]]; then
          echo "::error::auctelis diff exited ${code} (unapproved authority growth or red flags)."
          exit "$code"
        fi
        echo "auctelis Authority Diff passed."
