# Generated by `authdiff ci init` / `authdiff init`.
# Lock-first gate: AUTHORITY.lock expansions fail until CODEOWNERS approve.
# Day-one .authdiff.yml stays advisory (fail_on: never); the lock is the product gate.
name: authdiff
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  authdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install authdiff (git tag; PyPI not published yet)
        run: >
          pip install
          "git+https://github.com/YOUR_GITHUB_ORG/authdiff.git@v1.0.0#subdirectory=tools"

      - name: authdiff Authority Diff
        uses: YOUR_GITHUB_ORG/authdiff/.github/actions/authdiff-gate@v1.0.0
        with:
          path: .
          mode: scan
          # Leave fail-on empty to honor advisory .authdiff.yml (never).
          trusted-policy: "true"
          authority-diff: "true"
          locked: "true"
          install-tools-from: path
          annotate: true
          output-dir: authdiff-out
