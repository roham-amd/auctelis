# Generated by `auctelis ci init` / `auctelis init`.
# Lock-first gate: AUTHORITY.lock expansions fail until CODEOWNERS approve.
# Day-one .auctelis.yml stays advisory (fail_on: never); the lock is the product gate.
name: auctelis
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install auctelis (git tag; PyPI not published yet)
        run: >
          pip install
          "git+https://github.com/roham-amd/auctelis.git@v0.3.3#subdirectory=tools"

      - name: auctelis Authority Diff
        # High-assurance: pin by commit SHA instead of the mutable tag.
        # uses: roham-amd/auctelis/.github/actions/auctelis-gate@<commit-sha>
        uses: roham-amd/auctelis/.github/actions/auctelis-gate@v0.3.3
        with:
          path: .
          mode: scan
          # Leave fail-on empty to honor advisory .auctelis.yml (never).
          trusted-policy: "true"
          authority-diff: "true"
          locked: "true"
          install-tools-from: path
          annotate: true
          output-dir: auctelis-out
