# Generated by `auctelis init`.
# Advisory (default): Authority Diff posts on every PR; does not fail on growth.
# Pass `auctelis init --enforce` for locked=true + strict-ruleset (CODEOWNERS gate).
name: auctelis
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: auctelis Authority Diff
        # Pinned by auctelis to release v0.10.0 (never consumer-repo HEAD)
        uses: roham-amd/auctelis/.github/actions/auctelis-gate@v0.10.0
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: "false"
          strict-ruleset: "false"
          # Sticky Authority Diff always posts from the gate. Research scan /
          # annotate stays opt-in and is never a gate input.
          annotate: false
          output-dir: auctelis-out
