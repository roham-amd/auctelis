# Generated by `auctelis init`.
# Enforce mode: tree-truth Authority Diff fails on unapproved growth;
# CODEOWNERS must review changed authority paths. Pass `auctelis init --advisory`
# for warn-only (locked=false).
name: auctelis
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: auctelis Authority Diff
        # Pinned by auctelis to release v0.9.0 (never consumer-repo HEAD)
        uses: roham-amd/auctelis/.github/actions/auctelis-gate@v0.9.0
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: "true"
          strict-ruleset: "true"
          # Research findings annotations are opt-in (not a gate input).
          annotate: false
          output-dir: auctelis-out
