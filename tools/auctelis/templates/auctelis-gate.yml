# Generated by `auctelis ci init`.
# Enforce mode: AUTHORITY.lock drift fails the job; CODEOWNERS must review growth.
# Pass `auctelis ci init --advisory` for warn-only (locked=false).
name: auctelis
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: auctelis Authority Diff
        # Pin to the auctelis release tag. Tools are bundled in the Action —
        # no pip install on the consumer runner.
        uses: roham-amd/auctelis/.github/actions/auctelis-gate@v0.8.2
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: "true"
          strict-ruleset: "true"
          annotate: true
          output-dir: auctelis-out
