# Generated by `auctelis ci init`.
# Enforce mode: AUTHORITY.lock drift fails the job; CODEOWNERS must review growth.
# Pass `auctelis ci init --advisory` for warn-only (locked=false).
name: auctelis
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install auctelis (git tag; PyPI not published yet)
        run: >
          pip install
          "git+https://github.com/roham-amd/auctelis.git@v0.8.0#subdirectory=tools"

      - name: auctelis Authority Diff
        # Pin to an immutable commit SHA in production (ci init --apply resolves it).
        # uses: roham-amd/auctelis/.github/actions/auctelis-gate@<commit-sha>
        uses: roham-amd/auctelis/.github/actions/auctelis-gate@v0.8.0
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: "true"
          strict-ruleset: "true"
          install-tools-from: path
          annotate: true
          output-dir: auctelis-out
