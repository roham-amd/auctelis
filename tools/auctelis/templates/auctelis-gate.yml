# Generated by `auctelis init`.
# Advisory (default): Authority Diff posts when authority changes; growth is
# NEEDS_REVIEW but does not fail the required check. Set comment-on-none: true
# to post on every PR.
# Pass `auctelis init --enforce` for locked=true + strict-ruleset (CODEOWNERS gate).
name: auctelis
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: auctelis Authority Diff
        # Pinned by auctelis to release v0.1.10 (never consumer-repo HEAD)
        uses: roham-amd/auctelis@v0.1.10
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: "false"
          strict-ruleset: "false"
          output-dir: auctelis-out
