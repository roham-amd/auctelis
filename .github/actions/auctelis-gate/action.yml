name: auctelis Authority Diff
description: >-
  Passive auctelis scan with optional baseline Authority Diff, trusted
  .auctelis.yml policy loading, and sticky PR annotations. Does not execute target
  application code or contact MCP endpoints.

inputs:
  path:
    description: Repository path to assess (relative to workspace)
    required: false
    default: "."
  profile:
    description: >-
      Legacy audit profile (quick|standard|deployment). Ignored when mode=scan
      (default). Kept for consumers migrating from auctelis audit.
    required: false
    default: "quick"
  mode:
    description: scan (default). Legacy audit mode removed in 0.3.0.
    required: false
    default: "scan"
  baseline-inventory:
    description: Optional path to previous inventory.json for component-path diff
    required: false
    default: ""
  baseline:
    description: >-
      Optional path to previous baseline.json for risk delta.
      When empty, trusted/base policy.baseline is used if present.
    required: false
    default: ""
  fail-on:
    description: >-
      never | high | any. Leave empty to defer to trusted .auctelis.yml (or never when
      no policy). Explicit values always override the policy file.
    required: false
    default: ""
  policy:
    description: >-
      Explicit path to .auctelis.yml. When empty and trusted-policy=true on a PR,
      policy is loaded from the base ref. Otherwise only the scan-target file is
      used (never a parent outside the target).
    required: false
    default: ""
  no-policy:
    description: If true, ignore .auctelis.yml even when present
    required: false
    default: "false"
  trusted-policy:
    description: >-
      If true on pull_request events, load .auctelis.yml from the base ref so the PR
      author cannot weaken the gate by editing policy on the head ref. Also fails
      the job when the PR modifies .auctelis.yml (authority-surface change).
    required: false
    default: "true"
  output-dir:
    description: Output directory for auctelis artifacts
    required: false
    default: "auctelis-out"
  install-tools-from:
    description: >-
      Path to auctelis tools/ containing pyproject.toml. Empty (default) resolves to
      the Action-bundled tools directory when present, never the consumer
      workspace `tools/` by accident. Set to `path` or `pypi` to use a
      preinstalled `auctelis` on PATH (skip uv sync).
    required: false
    default: ""
  upload-sarif:
    description: If true, print path to findings.sarif.json for workflow upload
    required: false
    default: "true"
  annotate:
    description: If true (scan mode), emit GitHub Actions annotations from findings
    required: false
    default: "true"
  authority-diff:
    description: >-
      On pull_request events, scan the base ref and pass its baseline into the
      head scan so the PR comment is a true Authority Diff (facts added on head).
      Requires fetch-depth: 0 (or enough history to resolve the base ref).
    required: false
    default: "true"
  locked:
    description: >-
      If true (default), also run AUTHORITY.lock drift check
      (`auctelis check --locked`). Commit AUTHORITY.lock and protect it with
      CODEOWNERS. On a PR with no base-ref lock, a head AUTHORITY.lock is treated
      as adoption bootstrap (CODEOWNERS review of the lock itself); missing both
      base and head locks still fails closed. Set to false only for advisory scans.
    required: false
    default: "true"
  lock-file:
    description: Path to AUTHORITY.lock relative to the scan target (default: AUTHORITY.lock)
    required: false
    default: ""
  strict-ruleset:
    description: >-
      If true, authority growth with UNVERIFIED ruleset/branch-protection status
      fails the gate. Default false keeps best-effort PASS with a prominent
      "protection unverified" warning (missing rulesets still fail).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve auctelis tools directory
      id: tools
      shell: bash
      env:
        AUCTELIS_INSTALL_TOOLS_FROM: ${{ inputs.install-tools-from }}
        AUCTELIS_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Prefer explicit input, then Action-bundled tools, and only then a
        # workspace-relative path. Never silently uv-sync a PR-controlled tools/.
        # Special values path|pypi mean: use preinstalled CLI on PATH.
        chosen="${AUCTELIS_INSTALL_TOOLS_FROM}"
        if [[ "${chosen}" == "path" || "${chosen}" == "pypi" ]]; then
          if ! command -v auctelis >/dev/null 2>&1; then
            echo "::error::install-tools-from=${chosen} but auctelis is not on PATH. pip/uv install auctelis first."
            exit 1
          fi
          echo "mode=path" >> "$GITHUB_OUTPUT"
          echo "dir=" >> "$GITHUB_OUTPUT"
          echo "Using preinstalled auctelis on PATH."
          exit 0
        fi
        bundled="$(cd "$AUCTELIS_ACTION_PATH/../../.." && pwd)/tools"
        if [[ -z "${chosen}" ]]; then
          if [[ -f "${bundled}/pyproject.toml" ]]; then
            chosen="${bundled}"
            echo "Using Action-bundled auctelis tools: ${chosen}"
          elif command -v auctelis >/dev/null 2>&1; then
            echo "mode=path" >> "$GITHUB_OUTPUT"
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "install-tools-from empty; using preinstalled auctelis on PATH."
            exit 0
          elif [[ -f tools/pyproject.toml ]]; then
            echo "::error::install-tools-from is empty and Action-bundled tools were not found. Refusing to default to workspace ./tools (PR-controlled code execution risk). Pass install-tools-from explicitly to a pinned auctelis checkout, or install auctelis and set install-tools-from: path."
            exit 1
          else
            echo "::error::Could not locate auctelis tools/pyproject.toml"
            exit 1
          fi
        fi
        if [[ ! -f "${chosen}/pyproject.toml" ]]; then
          echo "::error::install-tools-from=${chosen} has no pyproject.toml"
          exit 1
        fi
        # Soft warning when tools resolve inside the default workspace without an
        # explicit .auctelis-kit / action-bundled path.
        if [[ "${chosen}" == "tools" || "${chosen}" == "./tools" ]]; then
          echo "::warning::install-tools-from points at workspace tools/. Prefer a pinned auctelis kit checkout or Action-bundled tools so PRs cannot supply the scanner."
        fi
        echo "mode=uv" >> "$GITHUB_OUTPUT"
        echo "dir=${chosen}" >> "$GITHUB_OUTPUT"

    - name: Install uv
      if: steps.tools.outputs.mode != 'path'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install auctelis tooling
      if: steps.tools.outputs.mode != 'path'
      shell: bash
      working-directory: ${{ steps.tools.outputs.dir }}
      run: |
        set -euo pipefail
        uv sync --locked --no-dev
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Flag .auctelis.yml policy edits on pull requests
      if: inputs.mode == 'scan' && inputs.trusted-policy == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        AUCTELIS_PATH: ${{ inputs.path }}
        AUCTELIS_BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "Not a git work tree; skipping policy-edit check."
          exit 0
        fi
        base="origin/${AUCTELIS_BASE_REF}"
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          git fetch --no-tags --depth=1 origin "${AUCTELIS_BASE_REF}:${AUCTELIS_BASE_REF}" || true
          base="${AUCTELIS_BASE_REF}"
        fi
        if git diff --name-only "${base}...HEAD" | grep -E '(^|/)\.auctelis\.yml$' >/dev/null; then
          # First-adoption PRs that *add* .auctelis.yml (absent on base) must not fail the gate.
          if git cat-file -e "${base}:.auctelis.yml" 2>/dev/null; then
            echo "::error::PR modifies existing .auctelis.yml. Policy changes are an authority-surface edit and must be reviewed on their own; the gate loads policy from the base ref when trusted-policy=true."
            exit 1
          fi
          echo "PR adds .auctelis.yml for the first time (allowed for adoption)."
        fi
        echo "No blocking .auctelis.yml edits in this PR."

    - name: Resolve trusted policy path
      if: inputs.mode == 'scan'
      id: trusted_policy
      shell: bash
      env:
        AUCTELIS_PATH: ${{ inputs.path }}
        AUCTELIS_BASE_REF: ${{ github.base_ref }}
        AUCTELIS_NO_POLICY: ${{ inputs.no-policy }}
        AUCTELIS_TRUSTED: ${{ inputs.trusted-policy }}
        AUCTELIS_POLICY_INPUT: ${{ inputs.policy }}
        AUCTELIS_EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        echo "path=" >> "$GITHUB_OUTPUT"
        if [[ "${AUCTELIS_NO_POLICY}" == "true" || -n "${AUCTELIS_POLICY_INPUT}" ]]; then
          exit 0
        fi
        if [[ "${AUCTELIS_TRUSTED}" != "true" || "${AUCTELIS_EVENT}" != "pull_request" ]]; then
          exit 0
        fi
        out="${RUNNER_TEMP}/auctelis-trusted-policy.yml"
        rm -f "$out"
        base="origin/${AUCTELIS_BASE_REF}"
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          base="${AUCTELIS_BASE_REF}"
        fi
        rel="${AUCTELIS_PATH%/}/.auctelis.yml"
        rel="${rel#./}"
        if git show "${base}:${rel}" >"$out" 2>/dev/null; then
          echo "Loaded trusted policy from ${base}:${rel}"
          echo "path=${out}" >> "$GITHUB_OUTPUT"
        elif git show "${base}:.auctelis.yml" >"$out" 2>/dev/null; then
          echo "Loaded trusted policy from ${base}:.auctelis.yml"
          echo "path=${out}" >> "$GITHUB_OUTPUT"
        else
          echo "No base-ref .auctelis.yml; scan will proceed without a trusted policy file."
        fi

    - name: Build base-ref Authority Diff baseline
      id: auth_diff
      if: >-
        inputs.mode == 'scan' &&
        inputs.authority-diff == 'true' &&
        github.event_name == 'pull_request' &&
        inputs.baseline == ''
      shell: bash
      env:
        AUCTELIS_PATH: ${{ inputs.path }}
        AUCTELIS_BASE_REF: ${{ github.base_ref }}
        AUCTELIS_NO_POLICY: ${{ inputs.no-policy }}
        AUCTELIS_TRUSTED_POLICY: ${{ steps.trusted_policy.outputs.path }}
        AUCTELIS_LOCK_FILE: ${{ inputs.lock-file }}
      run: |
        set -euo pipefail
        echo "path=" >> "$GITHUB_OUTPUT"
        echo "lock=" >> "$GITHUB_OUTPUT"
        echo "codeowners=" >> "$GITHUB_OUTPUT"
        base="origin/${AUCTELIS_BASE_REF}"
        if ! git rev-parse --verify "$base" >/dev/null 2>&1; then
          if ! git fetch --no-tags origin "${AUCTELIS_BASE_REF}:refs/remotes/origin/${AUCTELIS_BASE_REF}" 2>/dev/null; then
            echo "Could not resolve base ref ${AUCTELIS_BASE_REF}; skipping Authority Diff baseline."
            exit 0
          fi
          base="origin/${AUCTELIS_BASE_REF}"
        fi
        work="${RUNNER_TEMP}/auctelis-base-worktree"
        out="${RUNNER_TEMP}/auctelis-base-out"
        baseline="${RUNNER_TEMP}/auctelis-base-baseline.json"
        base_lock="${RUNNER_TEMP}/auctelis-base-AUTHORITY.lock"
        base_owners="${RUNNER_TEMP}/auctelis-base-CODEOWNERS"
        rm -rf "$work" "$out"
        rm -f "$base_lock" "$base_owners"
        git worktree add --detach "$work" "$base"
        # Scan the same relative path under the base worktree when possible.
        target="$work"
        rel="${AUCTELIS_PATH#./}"
        if [[ "$rel" != "." && -d "$work/$rel" ]]; then
          target="$work/$rel"
        fi
        # Extract the approved lock from the base ref (product gate input).
        lock_rel="${AUCTELIS_LOCK_FILE:-AUTHORITY.lock}"
        lock_rel="${lock_rel#./}"
        if [[ -f "$target/$lock_rel" ]]; then
          cp "$target/$lock_rel" "$base_lock"
          echo "Base-ref AUTHORITY.lock copied: $base_lock"
          echo "lock=${base_lock}" >> "$GITHUB_OUTPUT"
        elif git show "${base}:${lock_rel}" >"$base_lock" 2>/dev/null; then
          echo "Base-ref AUTHORITY.lock extracted from ${base}:${lock_rel}"
          echo "lock=${base_lock}" >> "$GITHUB_OUTPUT"
        else
          echo "No base-ref AUTHORITY.lock; lock delta will be absolute-on-head only."
        fi
        # Trusted CODEOWNERS from the base ref (PR authors cannot weaken owners).
        if [[ -f "$work/.github/CODEOWNERS" ]]; then
          cp "$work/.github/CODEOWNERS" "$base_owners"
        elif [[ -f "$work/CODEOWNERS" ]]; then
          cp "$work/CODEOWNERS" "$base_owners"
        elif git show "${base}:.github/CODEOWNERS" >"$base_owners" 2>/dev/null; then
          :
        elif git show "${base}:CODEOWNERS" >"$base_owners" 2>/dev/null; then
          :
        else
          rm -f "$base_owners"
        fi
        if [[ -f "$base_owners" ]]; then
          echo "Base-ref CODEOWNERS copied: $base_owners"
          echo "codeowners=${base_owners}" >> "$GITHUB_OUTPUT"
        fi
        base_args=(scan "$target" -o "$out" --save-baseline "$baseline" --fail-on never)
        if [[ "${AUCTELIS_NO_POLICY}" == "true" ]]; then
          base_args+=(--no-policy)
        elif [[ -n "${AUCTELIS_TRUSTED_POLICY:-}" ]]; then
          base_args+=(--policy "$AUCTELIS_TRUSTED_POLICY")
        fi
        auctelis "${base_args[@]}"
        echo "Base-ref baseline written: $baseline"
        echo "path=${baseline}" >> "$GITHUB_OUTPUT"
        git worktree remove --force "$work" || true

    - name: Run auctelis scan (passive)
      id: scan
      if: inputs.mode == 'scan'
      shell: bash
      env:
        AUCTELIS_PATH: ${{ inputs.path }}
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
        AUCTELIS_BASELINE: ${{ inputs.baseline }}
        AUCTELIS_AUTH_DIFF_BASELINE: ${{ steps.auth_diff.outputs.path }}
        AUCTELIS_BASE_LOCK: ${{ steps.auth_diff.outputs.lock }}
        AUCTELIS_FAIL_ON: ${{ inputs.fail-on }}
        AUCTELIS_POLICY: ${{ inputs.policy }}
        AUCTELIS_NO_POLICY: ${{ inputs.no-policy }}
        AUCTELIS_TRUSTED_POLICY: ${{ steps.trusted_policy.outputs.path }}
        AUCTELIS_TRUSTED: ${{ inputs.trusted-policy }}
        AUCTELIS_EVENT: ${{ github.event_name }}
        AUCTELIS_LOCKED: ${{ inputs.locked }}
        AUCTELIS_LOCK_FILE: ${{ inputs.lock-file }}
      run: |
        set -euo pipefail
        args=(scan "$AUCTELIS_PATH" -o "$AUCTELIS_OUTPUT_DIR")
        if [[ "${AUCTELIS_NO_POLICY}" == "true" ]]; then
          args+=(--no-policy)
        elif [[ -n "${AUCTELIS_POLICY}" ]]; then
          args+=(--policy "$AUCTELIS_POLICY")
        elif [[ -n "${AUCTELIS_TRUSTED_POLICY:-}" ]]; then
          args+=(--policy "$AUCTELIS_TRUSTED_POLICY")
          echo "Using trusted base-ref policy: $AUCTELIS_TRUSTED_POLICY"
        elif [[ "${AUCTELIS_TRUSTED}" == "true" && "${AUCTELIS_EVENT}" == "pull_request" ]]; then
          # Blindfold: never honor a PR-authored .auctelis.yml via explicit --policy.
          # First-adoption PRs that add policy are allowed by the edit check, but
          # suppressions from that new file must not silence the gate on the same PR.
          args+=(--no-policy)
          echo "trusted-policy=true and no base-ref policy; scanning with --no-policy"
        elif [[ -f "${AUCTELIS_PATH}/.auctelis.yml" ]]; then
          args+=(--policy "${AUCTELIS_PATH}/.auctelis.yml")
          echo "Auto-loaded policy: ${AUCTELIS_PATH}/.auctelis.yml"
        fi
        if [[ -n "${AUCTELIS_FAIL_ON}" ]]; then
          args+=(--fail-on "$AUCTELIS_FAIL_ON")
        fi
        baseline="${AUCTELIS_BASELINE}"
        if [[ -z "$baseline" && -n "${AUCTELIS_AUTH_DIFF_BASELINE:-}" ]]; then
          baseline="${AUCTELIS_AUTH_DIFF_BASELINE}"
          echo "Using Authority Diff base-ref baseline: $baseline"
        fi
        if [[ -n "$baseline" ]]; then
          args+=(--baseline "$baseline")
        fi
        if [[ -n "${AUCTELIS_BASE_LOCK:-}" && -f "${AUCTELIS_BASE_LOCK}" ]]; then
          args+=(--base-lock "$AUCTELIS_BASE_LOCK")
          echo "Comparing head authority against base-ref AUTHORITY.lock (advisory; gate decides)"
        fi
        if [[ "${AUCTELIS_LOCKED}" == "true" ]]; then
          args+=(--locked)
          if [[ -n "${AUCTELIS_LOCK_FILE}" ]]; then
            args+=(--lock-file "$AUCTELIS_LOCK_FILE")
          fi
          echo "AUTHORITY.lock drift check enabled"
        fi
        # Capture exit so comment/artifact steps can still run; gate is the
        # authority-growth verdict. Re-fail after reporting when scan itself failed.
        set +e
        auctelis "${args[@]}"
        scan_code=$?
        set -e
        echo "code=${scan_code}" >> "$GITHUB_OUTPUT"
        if [[ "$scan_code" -ne 0 ]]; then
          echo "::warning::auctelis scan exited ${scan_code}; continuing so gate/comment/artifact can run."
        fi

    - name: Enforce base-lock gate (growth label + CODEOWNERS/ruleset)
      id: gate
      if: >-
        always() &&
        inputs.mode == 'scan' &&
        inputs.locked == 'true' &&
        github.event_name == 'pull_request' &&
        steps.auth_diff.outputs.lock != ''
      shell: bash
      env:
        AUCTELIS_PATH: ${{ inputs.path }}
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
        AUCTELIS_BASE_LOCK: ${{ steps.auth_diff.outputs.lock }}
        AUCTELIS_BASE_CODEOWNERS: ${{ steps.auth_diff.outputs.codeowners }}
        AUCTELIS_LOCK_FILE: ${{ inputs.lock-file }}
        AUCTELIS_STRICT_RULESET: ${{ inputs.strict-ruleset }}
        # pull_request GITHUB_SHA is the merge commit; reviews use PR head.
        AUCTELIS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        head_lock="${AUCTELIS_LOCK_FILE:-AUTHORITY.lock}"
        head_path="${AUCTELIS_PATH%/}/${head_lock}"
        head_path="${head_path#./}"
        gate_args=(gate "$AUCTELIS_PATH" --base-lock "$AUCTELIS_BASE_LOCK")
        if [[ -f "$head_path" ]]; then
          gate_args+=(--head-lock "$head_path")
        fi
        if [[ -n "${AUCTELIS_BASE_CODEOWNERS:-}" && -f "${AUCTELIS_BASE_CODEOWNERS}" ]]; then
          gate_args+=(--codeowners "$AUCTELIS_BASE_CODEOWNERS")
          echo "Using trusted base-ref CODEOWNERS: $AUCTELIS_BASE_CODEOWNERS"
        fi
        if [[ "${AUCTELIS_STRICT_RULESET}" == "true" ]]; then
          gate_args+=(--strict-ruleset)
          echo "Strict ruleset: UNVERIFIED fails growth"
        fi
        # AUCTELIS_HEAD_SHA is available for diagnostics; gate is lock-only
        # (growth label + CODEOWNERS/ruleset) and does not count PR reviews.
        if [[ -n "${AUCTELIS_HEAD_SHA:-}" ]]; then
          echo "PR head: ${AUCTELIS_HEAD_SHA}"
        fi
        set +e
        auctelis "${gate_args[@]}"
        gate_code=$?
        set -e
        echo "code=${gate_code}" >> "$GITHUB_OUTPUT"
        if [[ -f "$AUCTELIS_OUTPUT_DIR/gate-report.txt" ]]; then
          echo "## auctelis growth gate" >> "$GITHUB_STEP_SUMMARY"
          cat "$AUCTELIS_OUTPUT_DIR/gate-report.txt" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "protection unverified" "$AUCTELIS_OUTPUT_DIR/gate-report.txt"; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Warning:** ruleset protection was **UNVERIFIED**. A green growth label is not proof that code-owner review is enforced." >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        # Do not exit yet — comment/artifact steps use always(). Final step fails the job.

    - name: Annotate pull request findings
      if: always() && inputs.mode == 'scan' && inputs.annotate == 'true'
      shell: bash
      env:
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        FINDINGS="$AUCTELIS_OUTPUT_DIR/findings.json"
        if [[ ! -f "$FINDINGS" ]]; then
          echo "No findings.json; skipping annotations."
          exit 0
        fi
        auctelis annotate "$FINDINGS" --format github

    - name: Authority Diff PR comment
      if: always() && inputs.mode == 'scan' && inputs.annotate == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        FINDINGS="$AUCTELIS_OUTPUT_DIR/findings.json"
        COMMENT="$AUCTELIS_OUTPUT_DIR/pr-comment.md"
        DELTA="$AUCTELIS_OUTPUT_DIR/risk-delta.json"
        if [[ ! -f "$FINDINGS" ]]; then
          echo "No findings.json; skipping PR comment."
          exit 0
        fi
        if [[ ! -f "$COMMENT" ]]; then
          if [[ -f "$DELTA" ]]; then
            auctelis annotate "$FINDINGS" --format pr-comment --risk-delta "$DELTA" >"$COMMENT"
          else
            auctelis annotate "$FINDINGS" --format pr-comment >"$COMMENT"
          fi
        fi
        echo "## auctelis Authority Diff" >> "$GITHUB_STEP_SUMMARY"
        cat "$COMMENT" >> "$GITHUB_STEP_SUMMARY"
        if [[ -f "$AUCTELIS_OUTPUT_DIR/scan-summary.txt" ]]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Scan summary" >> "$GITHUB_STEP_SUMMARY"
          head -n 20 "$AUCTELIS_OUTPUT_DIR/scan-summary.txt" >> "$GITHUB_STEP_SUMMARY"
        fi
        # Sticky comment: update the comment that carries our marker, never --edit-last
        # (which can overwrite another workflow's bot comment).
        if command -v gh >/dev/null 2>&1 && [[ -n "${GITHUB_TOKEN:-}" ]]; then
          PR_NUM="${{ github.event.pull_request.number }}"
          MARKER="<!-- auctelis-authority-diff -->"
          existing_id="$(
            gh api "repos/${{ github.repository }}/issues/${PR_NUM}/comments" --paginate \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" 2>/dev/null \
              | head -n 1 || true
          )"
          if [[ -n "${existing_id}" ]]; then
            if gh api "repos/${{ github.repository }}/issues/comments/${existing_id}" \
              -X PATCH -F body=@"$COMMENT" >/dev/null 2>&1; then
              echo "Updated sticky auctelis PR comment id=${existing_id}."
            else
              echo "::warning::Failed to update sticky auctelis PR comment."
            fi
          else
            gh pr comment "$PR_NUM" --body-file "$COMMENT" \
              || echo "::warning::Failed to post auctelis PR comment (check pull-requests: write)."
          fi
        else
          echo "gh unavailable; Authority Diff written to $COMMENT and job summary."
        fi

    - name: Diff against baseline inventory (optional)
      if: inputs.baseline-inventory != ''
      shell: bash
      env:
        AUCTELIS_BASE_INVENTORY: ${{ inputs.baseline-inventory }}
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        BASE="$AUCTELIS_BASE_INVENTORY"
        CUR="$AUCTELIS_OUTPUT_DIR/inventory.json"
        OUT="$AUCTELIS_OUTPUT_DIR/inventory-delta.json"
        if [[ ! -f "$BASE" ]]; then
          echo "Baseline inventory not found; skipping diff."
          exit 0
        fi
        python -c "
        import json, pathlib, sys
        base = pathlib.Path(sys.argv[1])
        cur = pathlib.Path(sys.argv[2])
        out = pathlib.Path(sys.argv[3])
        b = {c.get('repository_path') or c.get('name') for c in json.loads(base.read_text(encoding='utf-8'))['components']}
        c = {c.get('repository_path') or c.get('name') for c in json.loads(cur.read_text(encoding='utf-8'))['components']}
        added = sorted(c - b)
        removed = sorted(b - c)
        print('## auctelis inventory delta')
        print('Added (%d): %s' % (len(added), ', '.join(added) or '(none)'))
        print('Removed (%d): %s' % (len(removed), ', '.join(removed) or '(none)'))
        out.write_text(json.dumps({'added': added, 'removed': removed}, indent=2) + '\n', encoding='utf-8')
        " "$BASE" "$CUR" "$OUT"

    - name: Report incomplete coverage
      if: always()
      shell: bash
      env:
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        INV="$AUCTELIS_OUTPUT_DIR/inventory.json"
        if [[ ! -f "$INV" ]]; then
          echo "No inventory.json; skipping coverage report."
          exit 0
        fi
        python -c "
        import json, pathlib, sys
        inv = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
        cov = inv.get('coverage') or {}
        print('## auctelis coverage')
        print('Deterministic discoveries:', cov.get('deterministically_discovered'))
        print('NOT VERIFIED:')
        for item in cov.get('not_verified') or []:
            print('-', item)
        print('Incomplete coverage must not be treated as a clean security result.')
        " "$INV"

    - name: Note SARIF path
      if: always() && inputs.upload-sarif == 'true' && inputs.mode == 'scan'
      shell: bash
      env:
        AUCTELIS_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        SARIF="$AUCTELIS_OUTPUT_DIR/findings.sarif.json"
        if [[ -f "$SARIF" ]]; then
          echo "SARIF ready for upload: $SARIF"
        else
          echo "SARIF not produced."
        fi

    - name: Upload auctelis artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: auctelis-out
        path: ${{ inputs.output-dir }}
        if-no-files-found: warn

    - name: Warn when authority growth is unchecked
      if: always() && inputs.mode == 'scan' && inputs.locked == 'false'
      shell: bash
      run: |
        echo "::warning::auctelis locked=false — authority growth is unchecked. Set locked=true after AUTHORITY.lock is committed."

    - name: Fail job on scan or gate verdict
      if: always() && inputs.mode == 'scan'
      shell: bash
      env:
        AUCTELIS_SCAN_CODE: ${{ steps.scan.outputs.code }}
        AUCTELIS_GATE_CODE: ${{ steps.gate.outputs.code }}
        AUCTELIS_SCAN_OUTCOME: ${{ steps.scan.outcome }}
        AUCTELIS_GATE_OUTCOME: ${{ steps.gate.outcome }}
        AUCTELIS_LOCKED: ${{ inputs.locked }}
        AUCTELIS_BASE_LOCK: ${{ steps.auth_diff.outputs.lock }}
        AUCTELIS_EVENT_NAME: ${{ github.event_name }}
        AUCTELIS_PATH: ${{ inputs.path }}
        AUCTELIS_LOCK_FILE: ${{ inputs.lock-file }}
      run: |
        set -euo pipefail
        if [[ "${AUCTELIS_SCAN_OUTCOME}" == "skipped" ]]; then
          echo "::error::auctelis scan did not run (earlier step failed)."
          exit 1
        fi
        scan_code="${AUCTELIS_SCAN_CODE:-0}"
        gate_code="${AUCTELIS_GATE_CODE:-0}"
        [[ -z "$scan_code" ]] && scan_code=0
        [[ -z "$gate_code" ]] && gate_code=0
        # locked=true on a PR must not silently skip the gate — except adoption
        # bootstrap, where the first AUTHORITY.lock lands on head with no base lock.
        head_lock_rel="${AUCTELIS_LOCK_FILE:-AUTHORITY.lock}"
        head_lock_path="${AUCTELIS_PATH%/}/${head_lock_rel}"
        head_lock_path="${head_lock_path#./}"
        if [[ "${AUCTELIS_LOCKED}" == "true" && "${AUCTELIS_EVENT_NAME}" == "pull_request" ]]; then
          if [[ -z "${AUCTELIS_BASE_LOCK}" ]]; then
            if [[ -f "$head_lock_path" ]]; then
              echo "::notice::BASELINE_ADOPTED — adoption ceremony (not a growth-gate PASS). Head AUTHORITY.lock must be CODEOWNERS-reviewed on this PR; later PRs require base-lock growth approval."
              {
                echo "## auctelis adoption ceremony"
                echo "**Verdict:** \`BASELINE_ADOPTED\` (not equivalent to growth gate PASS)"
                echo ""
                echo "This PR introduces the first \`AUTHORITY.lock\` with no trusted base lock."
                echo "Require human CODEOWNERS review of the baseline and protection config before merge."
                echo "Subsequent PRs compare against this base and run the growth gate."
              } >> "$GITHUB_STEP_SUMMARY"
              gate_code=0
            else
              echo "::error::locked=true but neither base nor head has AUTHORITY.lock — fail closed."
              exit 1
            fi
          elif [[ "${AUCTELIS_GATE_OUTCOME}" == "skipped" ]]; then
            echo "::error::auctelis gate skipped while locked=true on a pull_request with a base lock."
            exit 1
          fi
        elif [[ "${AUCTELIS_GATE_OUTCOME}" == "skipped" ]]; then
          gate_code=0
          echo "auctelis gate skipped (not a locked PR, or no base lock required)."
        fi
        if [[ "$gate_code" -ne 0 ]]; then
          echo "::error::auctelis gate exited ${gate_code} (unapproved authority growth)."
          exit "$gate_code"
        fi
        if [[ "$scan_code" -ne 0 ]]; then
          echo "::error::auctelis scan exited ${scan_code}."
          exit "$scan_code"
        fi
        if [[ -z "${AUCTELIS_BASE_LOCK}" && "${AUCTELIS_LOCKED}" == "true" && "${AUCTELIS_EVENT_NAME}" == "pull_request" && -f "$head_lock_path" ]]; then
          echo "auctelis adoption ceremony complete (BASELINE_ADOPTED); scan passed."
        else
          echo "auctelis scan and gate passed."
        fi
