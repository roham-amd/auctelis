name: authdiff validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      # Patch pin for CI reproducibility; .python-version keeps the minor (3.12).
      - name: Set up Python
        run: uv python install 3.12.16

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run --locked authdiff-dev lint --check-format

      - name: Type check (mypy)
        run: uv run --locked mypy authdiff

      - name: Dependency audit
        run: uv run --locked pip-audit

      - name: Build and consistency checks
        working-directory: .
        run: uv run --directory tools --locked authdiff-dev build all

      - name: Corpus harness
        working-directory: .
        run: uv run --directory tools --locked authdiff-dev corpus run

      - name: Pytest
        run: uv run --locked pytest -q ../tests

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.12.16

      - name: Build wheel and smoke-test installed CLI
        working-directory: tools
        run: |
          uv build
          uv venv /tmp/authdiff-wheel-smoke --python 3.12.16
          uv pip install --python /tmp/authdiff-wheel-smoke dist/*.whl
          # Demo must work from the installed wheel without the repo examples/ tree.
          # demo always exits 0 (aha walkthrough). Bare scan uses --fail-on high.
          set +e
          /tmp/authdiff-wheel-smoke/bin/authdiff demo -o /tmp/authdiff-wheel-demo
          demo_rc=$?
          /tmp/authdiff-wheel-smoke/bin/authdiff scan ../examples/demo-vulnerable -o /tmp/authdiff-wheel-out --fail-on high
          scan_rc=$?
          set -e
          test "$demo_rc" -eq 0
          test "$scan_rc" -eq 1
          grep -E 'Authority delta|ADVISORY|BLOCK' /tmp/authdiff-wheel-demo/pr-comment.md
          grep -E 'DECISION:[[:space:]]*BLOCK' /tmp/authdiff-wheel-out/scan-summary.txt
          /tmp/authdiff-wheel-smoke/bin/authdiff gate --help >/dev/null
          /tmp/authdiff-wheel-smoke/bin/authdiff --help >/dev/null
