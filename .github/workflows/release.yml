# Build, sign, attach assets to the GitHub Release, and publish to GitHub Packages.
# Trigger: push a version tag matching v* (e.g. v0.4.0).
# PyPI remains a separate trusted-publishing workflow (publish-pypi.yml).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  # Releases must not ship from a red tree. Mirror auctelis-validate.yml
  # (including pip-audit + wheel-smoke) before attaching assets.
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.12.16

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run --locked auctelis-dev lint --check-format

      - name: Type check (mypy)
        run: uv run --locked mypy auctelis

      - name: Dependency audit
        run: uv run --locked pip-audit

      - name: Build and consistency checks
        working-directory: .
        run: uv run --directory tools --locked auctelis-dev build all

      - name: Corpus
        working-directory: .
        run: uv run --directory tools --locked auctelis-dev corpus run

      - name: Pytest
        run: uv run --locked pytest -q ../tests

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.12.16

      - name: Build wheel and smoke-test installed CLI
        working-directory: tools
        run: |
          uv build
          uv venv /tmp/auctelis-wheel-smoke --python 3.12.16
          uv pip install --python /tmp/auctelis-wheel-smoke dist/*.whl
          # Fresh wheel must start without the repo or the dev dependency group.
          /tmp/auctelis-wheel-smoke/bin/auctelis --version
          /tmp/auctelis-wheel-smoke/bin/auctelis --help >/dev/null
          /tmp/auctelis-wheel-smoke/bin/auctelis gate --help >/dev/null
          set +e
          /tmp/auctelis-wheel-smoke/bin/auctelis demo -o /tmp/auctelis-wheel-demo
          demo_rc=$?
          /tmp/auctelis-wheel-smoke/bin/auctelis scan ../examples/demo-vulnerable -o /tmp/auctelis-wheel-out --fail-on high
          scan_rc=$?
          set -e
          test "$demo_rc" -eq 0
          test "$scan_rc" -eq 1
          grep -E 'Authority delta|ADVISORY|BLOCK|PASS|GROWTH' /tmp/auctelis-wheel-demo/pr-comment.md
          grep -E 'Authority delta|ADVISORY|BLOCK|PASS|GROWTH|DECISION' /tmp/auctelis-wheel-out/scan-summary.txt

  release:
    needs: [validate, wheel-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.12.16

      - name: Verify version metadata
        run: uv run --directory tools --locked auctelis-dev build all

      - name: Build wheel + sdist
        working-directory: tools
        run: |
          mkdir -p ../auctelis-out-sbom ../signatures
          uv build

      - name: Generate SBOM
        working-directory: tools
        run: |
          uv sync --locked
          uv run --locked pip-audit -f cyclonedx-json -o ../auctelis-out-sbom/sbom.cdx.json \
            || uv run --locked pip-audit -f json -o ../auctelis-out-sbom/sbom.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign artifacts (keyless)
        working-directory: tools
        run: |
          set -euo pipefail
          for f in dist/*; do
            cosign sign-blob --yes --bundle "../signatures/$(basename "$f").cosign.bundle" "$f"
          done
          if [[ -f ../auctelis-out-sbom/sbom.cdx.json ]]; then
            cosign sign-blob --yes --bundle ../signatures/sbom.cdx.json.cosign.bundle \
              ../auctelis-out-sbom/sbom.cdx.json
          fi

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(python - <<'PY'
          from pathlib import Path
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## |\Z)"
          m = re.search(pat, text, re.S)
          body = m.group(1).strip() if m else f"Release {os.environ['GITHUB_REF_NAME']}"
          print(body)
          PY
          )
          assets=(tools/dist/* signatures/*)
          if [[ -f auctelis-out-sbom/sbom.cdx.json ]]; then
            assets+=(auctelis-out-sbom/sbom.cdx.json)
          elif [[ -f auctelis-out-sbom/sbom.json ]]; then
            assets+=(auctelis-out-sbom/sbom.json)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Auctelis ${TAG#v}" \
              --notes "$NOTES" \
              --latest
          fi

      # Optional; public distribution is GitHub Release assets + PyPI (publish-pypi.yml).
      - name: Publish to GitHub Packages
        continue-on-error: true
        working-directory: tools
        env:
          UV_PUBLISH_URL: https://upload.pypi.pkg.github.com/roham-amd
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: uv publish --check-url https://pypi.pkg.github.com/roham-amd/auctelis/simple/
