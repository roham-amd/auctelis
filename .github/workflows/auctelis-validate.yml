name: auctelis validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      # Patch pin for CI reproducibility; .python-version keeps the minor (3.12).
      - name: Set up Python
        run: uv python install 3.12.16

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run --locked auctelis-dev lint --check-format

      - name: Type check (mypy)
        run: uv run --locked mypy auctelis

      - name: Dependency audit
        run: uv run --locked pip-audit

      - name: Build and consistency checks
        working-directory: .
        run: uv run --directory tools --locked auctelis-dev build all

      - name: Corpus harness
        working-directory: .
        run: uv run --directory tools --locked auctelis-dev corpus run

      - name: Pytest
        run: uv run --locked pytest -q ../tests

  # Week-2 OS matrix: product CLI smoke on Windows / macOS (full lint stays Ubuntu).
  pytest-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.12.16

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest (product path)
        run: uv run --locked pytest -q ../tests/test_watch_and_cursor_hooks.py ../tests/test_northstar_30d.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.12.16

      - name: Build wheel and smoke-test installed CLI
        working-directory: tools
        run: |
          uv build
          uv venv /tmp/auctelis-wheel-smoke --python 3.12.16
          uv pip install --python /tmp/auctelis-wheel-smoke dist/*.whl
          # Fresh wheel must start without the repo or the dev dependency group.
          /tmp/auctelis-wheel-smoke/bin/auctelis --version
          /tmp/auctelis-wheel-smoke/bin/auctelis --help >/dev/null
          /tmp/auctelis-wheel-smoke/bin/auctelis gate --help >/dev/null
          # Demo must work from the installed wheel without the repo examples/ tree.
          # demo always exits 0 (aha walkthrough). Bare scan uses --fail-on high.
          set +e
          /tmp/auctelis-wheel-smoke/bin/auctelis demo -o /tmp/auctelis-wheel-demo
          demo_rc=$?
          /tmp/auctelis-wheel-smoke/bin/auctelis scan ../examples/demo-vulnerable -o /tmp/auctelis-wheel-out --fail-on high
          scan_rc=$?
          set -e
          test "$demo_rc" -eq 0
          test "$scan_rc" -eq 1
          grep -E 'Authority delta|ADVISORY|BLOCK|PASS|GROWTH' /tmp/auctelis-wheel-demo/pr-comment.md
          grep -E 'Authority delta|ADVISORY|BLOCK|PASS|GROWTH|DECISION' /tmp/auctelis-wheel-out/scan-summary.txt
