name: auctelis validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      # Patch pin for CI reproducibility; .python-version keeps the minor (3.12).
      - name: Set up Python
        run: uv python install 3.12.16

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint (Ruff)
        run: uv run --locked auctelis-dev lint --check-format

      - name: Type check (mypy)
        run: uv run --locked mypy auctelis

      - name: Dependency audit
        run: uv run --locked pip-audit

      - name: Build and consistency checks
        working-directory: .
        run: uv run --directory tools --locked auctelis-dev build all

      - name: Corpus harness
        working-directory: .
        run: uv run --directory tools --locked auctelis-dev corpus run

      - name: Pytest
        run: uv run --locked pytest -q ../tests

      - name: Dogfood lock freshness
        working-directory: .
        run: |
          # Always target the repository root (GITHUB_WORKSPACE), never tools/.
          # `check .` under working-directory: tools silently looks for tools/AUTHORITY.lock.
          # --strict-digests: dogfood must catch plain-CI/prose digest churn (AUCT-033/034).
          repo="${GITHUB_WORKSPACE:-$PWD}"
          uv run --directory tools --locked auctelis-dev check --strict-digests "$repo"
          uv run --directory tools --locked auctelis-dev lock --check --strict-digests "$repo"

  # Week-2 OS matrix: product CLI smoke on Windows / macOS (full lint stays Ubuntu).
  pytest-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.12.16

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest (product path)
        run: >
          uv run --locked pytest -q
          ../tests/test_inspect_target.py
          ../tests/test_inspect_cli.py
          ../tests/test_package_source.py
          ../tests/test_local_hosts.py
          ../tests/test_diff_inspect.py
          ../tests/test_issueops_dossiers.py
          ../tests/test_attack_replay_corpus.py
          ../tests/test_wheel_scripts.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.12.16

      - name: Build wheel and smoke-test installed CLI
        working-directory: tools
        run: |
          uv build
          uv venv /tmp/auctelis-wheel-smoke --python 3.12.16
          uv pip install --python /tmp/auctelis-wheel-smoke dist/*.whl
          # Fresh wheel must start without the repo or the dev dependency group.
          /tmp/auctelis-wheel-smoke/bin/auctelis --version
          /tmp/auctelis-wheel-smoke/bin/auctelis --help >/dev/null
          /tmp/auctelis-wheel-smoke/bin/auctelis inspect --help >/dev/null
          /tmp/auctelis-wheel-smoke/bin/auctelis diff --help >/dev/null
          set +e
          /tmp/auctelis-wheel-smoke/bin/auctelis inspect ../examples/demo-vulnerable --offline
          inspect_rc=$?
          set -e
          test "$inspect_rc" -eq 1
          /tmp/auctelis-wheel-smoke/bin/auctelis inspect ../examples/demo-vulnerable --offline | grep -F '## Red Flags'
          # Research / maintainer modules must not ship in the product wheel.
          # -P: do not prepend the tools/ cwd (source checkout) onto sys.path.
          /tmp/auctelis-wheel-smoke/bin/python -P -c "import importlib.util,sys; mods=('auctelis_research','auctelis.build','auctelis.cli.dev_commands','auctelis.export.sarif'); sys.exit(0 if all(importlib.util.find_spec(m) is None for m in mods) else 1)"
