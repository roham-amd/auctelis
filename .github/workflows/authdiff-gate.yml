# Dogfood: run this repo's composite Action against itself.
# Consumers should prefer the tagged recipe from `authdiff ci init` /
# docs/authdiff-consumer-gate.example.yml (immutable tag or commit SHA).
name: authdiff
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  authdiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install authdiff from this checkout
        working-directory: tools
        run: |
          set -euo pipefail
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: authdiff Authority Diff
        uses: ./.github/actions/authdiff-gate
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: "true"
          install-tools-from: path
          annotate: true
          output-dir: authdiff-out
