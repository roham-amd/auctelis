# Dogfood: run this repo's composite Action against itself.
# Consumers should prefer the tagged recipe from `auctelis ci init` /
# docs/auctelis-consumer-gate.example.yml (immutable tag or commit SHA).
name: auctelis
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  auctelis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.3.4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install auctelis from this checkout
        working-directory: tools
        run: |
          set -euo pipefail
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: auctelis Authority Diff
        uses: ./
        with:
          path: .
          mode: scan
          trusted-policy: "true"
          authority-diff: "true"
          locked: "true"
          # locked=true defaults strict-ruleset on; set explicitly for dogfood clarity
          strict-ruleset: "true"
          install-tools-from: path
          output-dir: auctelis-out
