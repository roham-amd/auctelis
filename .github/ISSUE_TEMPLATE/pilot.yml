name: External pilot
description: Track an outside repository adopting the auctelis PR authority gate
title: "[pilot] "
labels: ["pilot"]
body:
  - type: markdown
    attributes:
      value: |
        Use one issue per outside repository. Self-dogfood of auctelis does not count.
        Update [`docs/pilots/TRACKER.md`](../../docs/pilots/TRACKER.md) when status changes.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: owner/name (public or accessible)
      placeholder: acme/platform-agents
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface mix
      options:
        - MCP registration
        - Skills (Cursor/Claude)
        - Hooks + host settings
        - Plugin / connector permissions
        - CI agent/MCP workflows
        - Mixed
    validations:
      required: true
  - type: dropdown
    id: slot
    attributes:
      label: Tracker slot (1–5)
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - unassigned
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Pilot path
      options:
        - Host hook (watch --seal / watch --arm)
        - Team repo (lockless Action)
        - Team repo (locked gate + CODEOWNERS)
    validations:
      required: true
  - type: input
    id: first_lock
    attributes:
      label: First seal / first AUTHORITY.lock merge date (UTC)
      placeholder: 2026-11-20
  - type: dropdown
    id: taught
    attributes:
      label: Did the single delta line teach you something you would have missed?
      options:
        - "yes"
        - partial
        - "no"
        - not yet
  - type: textarea
    id: notes
    attributes:
      label: Setup notes / FP-FN observations
      description: Link PRs, note hook status at week 4, UNVERIFIED share, usefulness of the delta line
